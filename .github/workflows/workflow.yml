name: CI Workflow

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci-workflow:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless
          pip3 install pytest pytest-xdist zapcli

      - name: Install OWASP ZAP
        run: |
          wget https://github.com/zaproxy/zaproxy/releases/download/v2.16.0/ZAP_2.16.0_Linux.tar.gz
          tar -xvzf ZAP_2.16.0_Linux.tar.gz
          echo "ZAP_PATH=$PWD/ZAP_2.16.0" >> "$GITHUB_ENV"

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Application (SCA)
        run: npm install

      - name: Run ESLint (SAST)
        run: npx eslint --config .eslintrc.cjs . --ext .js

      - name: Run app
        run: |
          npm start &
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3123/ping > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready in time"
          exit 1
        env:
          PORT: "3123"
          MONGODB_URI: mongodb://127.0.0.1:27017/dummyjson
          JWT_SECRET: randomstring

      - name: Start ZAP
        run: |
          AUTH_TOKEN=$(curl --fail --silent --show-error -X POST \
            -H 'Content-Type: application/json' \
            "http://localhost:3123/auth/login" \
            -d "{\"username\": \"${{ secrets.USERNAME }}\", \"password\":\"${{ secrets.PASSWORD }}\"}" | jq -er ".accessToken")
          curl --fail --silent --show-error --get \
            --data-urlencode "description=Authenticate application scan" \
            --data-urlencode "enabled=true" \
            --data-urlencode "matchType=REQ_HEADER" \
            --data-urlencode "matchRegex=false" \
            --data-urlencode "matchString=Authorization" \
            --data-urlencode "replacement=Bearer $AUTH_TOKEN" \
            "http://localhost:8090/JSON/replacer/action/addRule/"
          $ZAP_PATH/zap.sh -daemon -host 0.0.0.0 -port 8090 -config api.disablekey=true &
          sleep 30

      - name: Run ZAP scan (DAST)
        run: |
          zap-cli -p 8090 status -t 120
          zap-cli -p 8090 -v quick-scan \
            --spider \
            "http://localhost:3123/"

      - name: Stop App and ZAP
        if: always()
        run: |
          zap-cli -p 8090 shutdown || true
          pkill -f "node index.js" || true
