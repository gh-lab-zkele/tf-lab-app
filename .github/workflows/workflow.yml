name: CI Workflow

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless

      - name: Install OWASP ZAP
        run: |
          wget https://github.com/zaproxy/zaproxy/releases/download/v2.16.0/ZAP_2.16.0_Linux.tar.gz
          tar -xzf ZAP_2.16.0_Linux.tar.gz
          echo "ZAP_PATH=$PWD/ZAP_2.16.0" >> "$GITHUB_ENV"

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Application (SCA)
        run: npm install

      - name: Run ESLint (SAST)
        run: |
          npm install --no-save eslint-plugin-security@3.0.1
          cat > .eslintrc.cjs <<'EOF'
          module.exports = {
            extends: ["plugin:security/recommended-legacy"],
            parserOptions: {
              ecmaVersion: 2022,
              sourceType: "module"
            },
            env: {
              es2022: true,
              node: true
            },
            ignorePatterns: ["public/js/", "raw/", "scripts/"]
          };
          EOF
          npx eslint --no-eslintrc --config .eslintrc.cjs . --ext .js

      - name: Run app
        timeout-minutes: 3
        run: |
          node index.js > app.log 2>&1 &
          echo $! > app.pid

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3123/ping > /dev/null; then
              echo "Application is ready."
              exit 0
            fi

            if ! kill -0 "$(cat app.pid)" 2>/dev/null; then
              cat app.log
              echo "Application exited before becoming ready."
              exit 1
            fi

            sleep 2
          done

          cat app.log
          echo "Application did not become ready in time."
          exit 1
        env:
          PORT: "3123"
          MONGODB_URI: mongodb://127.0.0.1:27017/dummyjson
          JWT_SECRET: randomstring

      - name: Start ZAP
        timeout-minutes: 3
        run: |
          "$ZAP_PATH/zap.sh" -cmd -addonuninstall client
          "$ZAP_PATH/zap.sh" -daemon -host 0.0.0.0 -port 8090 -config api.disablekey=true > zap.log 2>&1 &
          echo $! > zap.pid

          ZAP_READY=false
          for attempt in {1..120}; do
            if curl --silent --fail http://127.0.0.1:8090/JSON/core/view/version/ | jq -e '.version' > /dev/null; then
              ZAP_READY=true
              break
            fi

            if ! kill -0 "$(cat zap.pid)" 2>/dev/null; then
              cat zap.log
              echo "ZAP exited before its API became ready."
              exit 1
            fi

            sleep 1
          done

          if [ "$ZAP_READY" != true ]; then
            cat zap.log
            echo "ZAP API did not become ready in time."
            exit 1
          fi

          : "${APP_USERNAME:?GitHub secret USERNAME is required}"
          : "${APP_PASSWORD:?GitHub secret PASSWORD is required}"

          LOGIN_STATUS=$(curl --silent --show-error \
            --output "$RUNNER_TEMP/login-response.json" \
            --write-out '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            "http://127.0.0.1:3123/auth/login" \
            --data "$(jq -n --arg username "$APP_USERNAME" --arg password "$APP_PASSWORD" \
              '{username: $username, password: $password}')")
          if [ "$LOGIN_STATUS" != 200 ]; then
            echo "Application login failed with HTTP $LOGIN_STATUS:"
            jq -r '.message // .error // "No error details returned"' "$RUNNER_TEMP/login-response.json"
            exit 1
          fi
          AUTH_TOKEN=$(jq -er ".accessToken" "$RUNNER_TEMP/login-response.json")

          REPLACER_STATUS=$(curl --silent --show-error \
            --output "$RUNNER_TEMP/zap-replacer-response.json" \
            --write-out '%{http_code}' \
            --get \
            --data-urlencode "description=Authenticate application scan" \
            --data-urlencode "enabled=true" \
            --data-urlencode "matchType=REQ_HEADER" \
            --data-urlencode "matchRegex=false" \
            --data-urlencode "matchString=Authorization" \
            --data-urlencode "replacement=Bearer $AUTH_TOKEN" \
            "http://127.0.0.1:8090/JSON/replacer/action/addRule/")
          if [ "$REPLACER_STATUS" != 200 ]; then
            echo "ZAP rejected the authentication rule with HTTP $REPLACER_STATUS:"
            cat "$RUNNER_TEMP/zap-replacer-response.json"
            exit 1
          fi
        env:
          APP_USERNAME: ${{ secrets.USERNAME }}
          APP_PASSWORD: ${{ secrets.PASSWORD }}

      - name: Run ZAP scan (DAST)
        timeout-minutes: 10
        run: |
          SPIDER_RESPONSE=$(curl --fail --silent --show-error --get \
            --data-urlencode "url=http://127.0.0.1:3123/" \
            "http://127.0.0.1:8090/JSON/spider/action/scan/")
          SCAN_ID=$(printf '%s' "$SPIDER_RESPONSE" | jq -er '.scan')

          SCAN_COMPLETE=false
          for attempt in {1..180}; do
            SCAN_STATUS=$(curl --fail --silent --show-error --get \
              --data-urlencode "scanId=$SCAN_ID" \
              "http://127.0.0.1:8090/JSON/spider/view/status/" | jq -er '.status | tonumber')
            if [ "$SCAN_STATUS" -eq 100 ]; then
              SCAN_COMPLETE=true
              break
            fi
            sleep 2
          done

          if [ "$SCAN_COMPLETE" != true ]; then
            echo "ZAP spider scan did not complete in time."
            exit 1
          fi

          PASSIVE_SCAN_COMPLETE=false
          for attempt in {1..180}; do
            RECORDS_TO_SCAN=$(curl --fail --silent --show-error \
              "http://127.0.0.1:8090/JSON/pscan/view/recordsToScan/" | jq -er '.recordsToScan | tonumber')
            if [ "$RECORDS_TO_SCAN" -eq 0 ]; then
              PASSIVE_SCAN_COMPLETE=true
              break
            fi
            sleep 2
          done

          if [ "$PASSIVE_SCAN_COMPLETE" != true ]; then
            echo "ZAP passive scan queue did not drain in time."
            exit 1
          fi

      - name: Stop App and ZAP
        if: always()
        run: |
          curl --silent --fail http://127.0.0.1:8090/JSON/core/action/shutdown/ > /dev/null || true
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" 2>/dev/null || true
          fi
